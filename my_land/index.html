<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my_land — صفحهٔ فرود</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container-inner">
      <div class="logo">
        <!-- سادهٔ لوگو: یک آیکون دایره و نام پروژه -->
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" fill="rgba(0,0,0,0.05)" />
          <text x="12" y="16" text-anchor="middle" font-size="9" fill="currentColor" font-family="Tahoma, Arial, sans-serif">ML</text>
        </svg>
        <span class="logo-text">my_land</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div class="welcome">
        <!-- آیکون خوش‌آمدگویی -->
        <svg class="icon-greet" width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2a5 5 0 0 1 5 5v1a3 3 0 0 1-3 3h-4a3 3 0 0 1-3-3V7a5 5 0 0 1 5-5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M8 14c-1 0-2 1-2 2v1a3 3 0 0 0 3 3h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <h1>خوش آمدید</h1>
        <p class="lead">از حضور شما خوشحالیم. برای تماس کافیست روی شماره کلیک کنید یا دکمهٔ تماس را بزنید.</p>
      </div>

      <div class="contact">
        <a class="phone" href="tel:09123456789">
          <!-- آیکون تلفن -->
          <svg class="icon-phone" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 3.08 4.18 2 2 0 0 1 5 2h3a2 2 0 0 1 2 1.72c.12 1.2.37 2.38.74 3.5a2 2 0 0 1-.45 2.11L9.91 10.09a16 16 0 0 0 6 6l1.76-1.76a2 2 0 0 1 2.11-.45c1.12.37 2.3.62 3.5.74A2 2 0 0 1 22 16.92z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="phone-number">09123456789</span>
        </a>

        <a class="btn" href="tel:09123456789">تماس بگیرید</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container-inner">© 2026 my_land</div>
  </footer>
</body>
</html>
